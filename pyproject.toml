[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tazama-oauth"
version = "0.1.0"
description = "Independent, scope-aware OAuth/OIDC security assessment foundation"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
tazama-oauth = "tazama_oauth.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
